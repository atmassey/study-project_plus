
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompTIA Project+ Study Guide</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --text-primary: #1A1830;
  --text-secondary: #6B6891;
  --bg-page: #F4F3FC;
  --bg-surface: #FFFFFF;
  --bg-secondary: #EEEDFE;
  --border: #DDD9F5;
  --accent: #3C3489;
  --accent-bg: #EEEDFE;
  --accent-text: #3C3489;
  --progress-fill: #534AB7;
  --card-shadow: 0 1px 3px rgba(60, 52, 137, 0.08), 0 0 0 1px var(--border);
  --radius-md: 8px;
  --radius-lg: 12px;
  --transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

[data-theme="dark"] {
  --text-primary: #E8E6FF;
  --text-secondary: #9490BF;
  --bg-page: #0F0E1A;
  --bg-surface: #1C1A30;
  --bg-secondary: #252240;
  --border: #2E2B4A;
  --accent: #7B75E8;
  --accent-bg: #252240;
  --accent-text: #A89FF5;
  --progress-fill: #6C66D8;
  --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--border);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 16px;
  max-width: 740px;
  margin: 0 auto;
  transition: var(--transition);
}

.sg-wrap { padding: 0.5rem 0 2.5rem; }
.sg-header { margin-bottom: 1.5rem; }
.sg-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sg-title { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
.sg-sub { font-size: 13px; color: var(--text-secondary); margin-top: 5px; line-height: 1.5; }

.theme-toggle {
  flex-shrink: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: var(--card-shadow);
  transition: var(--transition);
}
.theme-toggle:hover { background: var(--bg-secondary); }

.domain-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
.tab-btn {
  padding: 8px 14px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 13px;
  font-family: var(--font-sans);
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: var(--card-shadow);
  transition: var(--transition);
}
.tab-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; box-shadow: 0 2px 10px rgba(83, 74, 183, 0.35); }

.obj-grid { display: grid; gap: 10px; }
.obj-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--card-shadow);
  transition: var(--transition);
}
.obj-header {
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
  touch-action: manipulation;
  transition: background 0.15s;
}
.obj-header:hover { background: var(--bg-secondary); }
.obj-id {
  font-size: 11px; font-weight: 600;
  background: var(--accent-bg);
  color: var(--accent-text);
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.obj-title { font-size: 14px; font-weight: 500; color: var(--text-primary); flex: 1; line-height: 1.45; }
.obj-chevron { font-size: 16px; color: var(--text-secondary); transition: transform 0.2s; }
.obj-chevron.open { transform: rotate(180deg); }

.obj-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.obj-body.open { display: block; }

.section-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin: 16px 0 9px;
}

.key-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.key-list li { font-size: 13px; color: var(--text-primary); padding-left: 16px; position: relative; line-height: 1.55; }
.key-list li::before { content: "–"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

.term-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.term-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  border: 1px solid var(--border);
  transition: var(--transition);
}
.term-name { font-size: 12px; font-weight: 600; color: var(--accent-text); margin-bottom: 4px; }
.term-def { font-size: 12px; color: var(--text-secondary); line-height: 1.45; }

.flash-wrap { margin-top: 8px; }
.flash-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 22px 18px;
  cursor: pointer;
  min-height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  user-select: none;
  border: 1px solid var(--border);
  touch-action: manipulation;
  transition: var(--transition), transform 0.1s;
}
.flash-card:active { transform: scale(0.98); }
.flash-q { font-size: 14px; color: var(--text-primary); font-weight: 500; line-height: 1.55; }
.flash-a { font-size: 14px; color: var(--accent-text); line-height: 1.55; display: none; font-weight: 500; }
.flash-card.flipped .flash-q { display: none; }
.flash-card.flipped .flash-a { display: block; }
.flash-hint { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 7px; }
.flash-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
.flash-nav button {
  padding: 10px 20px;
  font-size: 13px;
  min-width: 80px;
  font-family: var(--font-sans);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  cursor: pointer;
  touch-action: manipulation;
  transition: var(--transition);
}
.flash-nav button:hover { background: var(--bg-secondary); }
.flash-nav button:active { transform: scale(0.96); }
.flash-count { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

.tip-box {
  background: var(--accent-bg);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-top: 12px;
  border-left: 3px solid var(--accent);
  transition: var(--transition);
}
.tip-text { font-size: 13px; color: var(--accent-text); line-height: 1.55; }

.progress-bar-wrap { margin-bottom: 1.5rem; }
.progress-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: 500; }
.progress-bar { height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.progress-fill { height: 100%; background: var(--progress-fill); border-radius: 3px; transition: width 0.4s ease; }

/* Quiz */
.quiz-wrap { margin-top: 8px; }
.quiz-q { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; line-height: 1.5; }
.quiz-opts { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
.quiz-opt {
  padding: 10px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font-sans);
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  transition: var(--transition);
  line-height: 1.45;
  width: 100%;
}
.quiz-opt:hover:not([disabled]) { background: var(--accent-bg); border-color: var(--accent); }
.quiz-opt.correct { background: #d1fae5; border-color: #059669; color: #065f46; font-weight: 600; }
.quiz-opt.incorrect { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
[data-theme="dark"] .quiz-opt.correct { background: #064e3b; border-color: #059669; color: #6ee7b7; }
[data-theme="dark"] .quiz-opt.incorrect { background: #450a0a; border-color: #dc2626; color: #fca5a5; }
.quiz-feedback { font-size: 12px; font-weight: 600; margin: 0 0 8px; padding: 8px 12px; border-radius: var(--radius-md); }
.quiz-correct-msg { background: #d1fae5; color: #065f46; border: 1px solid #059669; }
.quiz-wrong-msg { background: #fee2e2; color: #991b1b; border: 1px solid #dc2626; }
[data-theme="dark"] .quiz-correct-msg { background: #064e3b; color: #6ee7b7; border-color: #059669; }
[data-theme="dark"] .quiz-wrong-msg { background: #450a0a; color: #fca5a5; border-color: #dc2626; }
.quiz-next, .quiz-retry {
  display: inline-block;
  padding: 10px 20px;
  font-size: 13px;
  font-family: var(--font-sans);
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 600;
  touch-action: manipulation;
  transition: var(--transition);
  margin-bottom: 8px;
}
.quiz-next:hover, .quiz-retry:hover { opacity: 0.88; }
.quiz-progress { font-size: 11px; color: var(--text-secondary); text-align: right; font-weight: 500; margin-top: 4px; }
.quiz-result { text-align: center; padding: 20px 0; }
.quiz-score { font-size: 26px; font-weight: 700; color: var(--accent-text); margin-bottom: 6px; }
.quiz-score-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }

@media (max-width: 600px) {
  body { padding: 12px; }
  .sg-title { font-size: 19px; }
  .term-grid { grid-template-columns: 1fr; }
  .domain-tabs { gap: 5px; }
  .tab-btn { font-size: 12px; padding: 7px 10px; }
  .obj-title { font-size: 13px; }
  .obj-body { padding: 0 12px 14px; }
  .key-list li { font-size: 13px; }
  .flash-q, .flash-a { font-size: 14px; }
  .flash-nav button { padding: 12px 16px; font-size: 14px; min-width: 70px; }
  .flash-nav { gap: 6px; }
  .flash-count { font-size: 13px; }
  .tip-text { font-size: 13px; }
  .term-name { font-size: 13px; }
  .term-def { font-size: 13px; }
}
</style>
</head>
<body>

<div class="sg-wrap">
  <h2 class="sr-only">CompTIA Project+ Study Guide — Weak Objectives</h2>
  <div class="sg-header">
    <div class="sg-header-row">
      <div>
        <div class="sg-title">CompTIA Project+ Study Guide</div>
        <div class="sg-sub">19 objectives to review · Tap any card to expand · Tap flashcard to reveal answer</div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-label"><span>Study progress</span><span id="prog-pct">0 of 19 reviewed</span></div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div class="domain-tabs" id="domain-tabs"></div>
  <div class="obj-grid" id="obj-grid"></div>
</div>

<script>
const data = [
  {
    id: "1.1", domain: "Domain 1", domainName: "Project Mgmt Concepts",
    title: "Explain the basic characteristics of a project and various methodologies and frameworks used in IT projects.",
    keys: [
      "A project has a defined start/end, unique deliverable, and temporary nature — distinct from operations (ongoing).",
      "Triple constraint: scope, time, cost — changes to one affect the others. Quality is sometimes added as a 4th.",
      "Waterfall: sequential phases (initiation → planning → execution → closing), each phase complete before the next.",
      "Agile: iterative sprints, adaptive planning, frequent delivery. Scrum uses sprints, sprint reviews, retrospectives.",
      "Kanban: visualize workflow on a board; limit work-in-progress (WIP); no fixed iterations.",
      "Hybrid: combines Waterfall structure with Agile flexibility — common in IT.",
      "PMBOK: PMI's process-based framework with 5 process groups and 10 knowledge areas.",
      "PRINCE2: structured, stage-based methodology popular in UK/EU; business justification is key throughout.",
      "Project manager, sponsor, stakeholders, project team, steering committee are common project roles."
    ],
    terms: [
      { t: "Project", d: "Temporary endeavor with a unique outcome and defined start/end." },
      { t: "Waterfall", d: "Linear sequential phases; rigid, documentation-heavy." },
      { t: "Agile", d: "Iterative, collaborative, adaptive to change." },
      { t: "Scrum", d: "Agile framework with sprints, stand-ups, retrospectives." },
      { t: "Sprint", d: "Fixed time-box (1–4 weeks) in Scrum to deliver working product." },
      { t: "Kanban", d: "Visual workflow with WIP limits; continuous flow." },
      { t: "Hybrid", d: "Mix of Waterfall and Agile elements." },
      { t: "PMBOK", d: "PMI framework; 5 process groups, 10 knowledge areas." },
    ],
    flashcards: [
      { q: "What 3 constraints define the triple constraint?", a: "Scope, Time, and Cost (Iron Triangle). Quality is sometimes included as a 4th." },
      { q: "How does a project differ from operations?", a: "Projects are temporary with a unique output; operations are ongoing and repetitive." },
      { q: "What is a sprint in Scrum?", a: "A fixed-length iteration (1–4 weeks) that produces a potentially shippable product increment." },
      { q: "What is the key principle of PRINCE2?", a: "Continued business justification — the project must remain justified at every stage." }
    ],
    tip: "Exam tip: Know which methodology fits a given scenario. Agile = changing requirements; Waterfall = fixed, well-defined scope; Hybrid = regulated industry with some flexibility."
  },
  {
    id: "1.3", domain: "Domain 1", domainName: "Project Mgmt Concepts",
    title: "Given a scenario, apply the change control process throughout the project life cycle.",
    keys: [
      "Change control prevents uncontrolled scope creep by requiring formal review of all changes.",
      "Change request (CR) is submitted → logged in the change log → analyzed for impact → reviewed by CCB → approved/rejected → implemented if approved → documented.",
      "CCB (Change Control Board): group of stakeholders who review and approve/reject change requests.",
      "Impact analysis: assess changes to scope, schedule, cost, quality, risk before approving.",
      "Approved changes must update the project management plan and relevant baselines.",
      "Scope creep: unauthorized scope additions; gold plating: adding extras not in scope (both are bad).",
      "Baseline: original approved plan. Changes are measured against it.",
      "Emergency changes may bypass normal process but must be documented after the fact."
    ],
    terms: [
      { t: "Change Request", d: "Formal document requesting a change to scope, schedule, cost, or quality." },
      { t: "CCB", d: "Change Control Board — approves/rejects changes." },
      { t: "Scope Creep", d: "Uncontrolled expansion of project scope without formal approval." },
      { t: "Gold Plating", d: "Adding unrequested features beyond scope." },
      { t: "Baseline", d: "Approved plan used to measure performance." },
      { t: "Change Log", d: "Record of all change requests and their status." },
    ],
    flashcards: [
      { q: "What is the correct order of the change control process?", a: "Submit CR → Log it → Impact analysis → CCB review → Approve/Reject → Implement → Document." },
      { q: "What is scope creep?", a: "Uncontrolled additions to project scope without formal approval through change control." },
      { q: "Who approves change requests?", a: "The Change Control Board (CCB), which includes key stakeholders." },
      { q: "What must be updated after a change is approved?", a: "The project management plan and relevant baselines (scope, schedule, cost)." }
    ],
    tip: "Exam tip: If a scenario asks what to do when a stakeholder requests a new feature mid-project — always submit a formal change request, never just add it."
  },
  {
    id: "1.4", domain: "Domain 1", domainName: "Project Mgmt Concepts",
    title: "Given a scenario, perform risk management activities.",
    keys: [
      "Risk: uncertain event that may have a positive (opportunity) or negative (threat) impact.",
      "Risk register: central document tracking all identified risks, probability, impact, owner, response.",
      "Risk identification: brainstorming, interviews, SWOT, checklist analysis, lessons learned.",
      "Qualitative analysis: prioritize risks using probability × impact matrix (PxI).",
      "Quantitative analysis: numerical analysis — EMV (Expected Monetary Value = Probability × Impact $).",
      "Risk responses for threats: Avoid, Transfer, Mitigate, Accept.",
      "Risk responses for opportunities: Exploit, Share, Enhance, Accept.",
      "Residual risk: risk remaining after response. Secondary risk: new risk created by a response.",
      "Risk tolerance/appetite: how much risk stakeholders are willing to accept.",
      "Contingency reserve: budget set aside for known risks. Management reserve: for unknown risks."
    ],
    terms: [
      { t: "Risk Register", d: "Log of all identified risks with probability, impact, and response." },
      { t: "EMV", d: "Expected Monetary Value = Probability × Impact in dollars." },
      { t: "Mitigation", d: "Reduce probability or impact of a threat." },
      { t: "Transfer", d: "Shift risk to a third party (insurance, contract)." },
      { t: "Avoid", d: "Change plan to eliminate the risk entirely." },
      { t: "Residual Risk", d: "Risk remaining after response strategies are applied." },
      { t: "Secondary Risk", d: "New risk introduced by a risk response." },
      { t: "Contingency Reserve", d: "Budget for known risks (identified in risk register)." },
    ],
    flashcards: [
      { q: "What are the 4 threat response strategies?", a: "Avoid, Transfer, Mitigate, Accept." },
      { q: "What are the 4 opportunity response strategies?", a: "Exploit, Share, Enhance, Accept." },
      { q: "How is EMV calculated?", a: "EMV = Probability (%) × Impact ($). Used to quantify risk in dollar terms." },
      { q: "What is the difference between residual and secondary risk?", a: "Residual = risk left after response. Secondary = new risk created by the response itself." },
      { q: "What is a risk register?", a: "A document that logs all identified risks with their probability, impact, owner, and planned response." }
    ],
    tip: "Exam tip: Know all 4 threat AND 4 opportunity strategies cold. Questions often give a scenario and ask which response strategy is being used."
  },
  {
    id: "1.5", domain: "Domain 1", domainName: "Project Mgmt Concepts",
    title: "Given a scenario, perform issue management activities.",
    keys: [
      "Issue: a problem that has already occurred (vs. risk which is uncertain/future).",
      "Issue log: tracks active issues — description, priority, owner, status, resolution date.",
      "Issue must be assigned an owner who is responsible for resolving it.",
      "Escalation: raising an unresolved issue to a higher level of authority when it can't be resolved at current level.",
      "Issues can arise from risks that were not mitigated, or from unexpected events.",
      "Issue resolution process: identify → log → assign owner → analyze → resolve → close and document.",
      "Priority and severity help determine which issues to address first.",
      "Distinguish: issue log (active problems) vs. risk register (potential future events)."
    ],
    terms: [
      { t: "Issue", d: "A problem that has already occurred requiring resolution." },
      { t: "Issue Log", d: "Tracks active issues, owners, status, and resolution." },
      { t: "Escalation", d: "Elevating unresolved issues to higher authority." },
      { t: "Issue Owner", d: "Person responsible for resolving a specific issue." },
      { t: "Severity", d: "Degree of impact an issue has on the project." },
    ],
    flashcards: [
      { q: "What is the difference between a risk and an issue?", a: "A risk is a potential future event. An issue is a problem that has already occurred." },
      { q: "What should always be assigned when an issue is logged?", a: "An issue owner — someone responsible for resolving it." },
      { q: "When is escalation appropriate?", a: "When an issue cannot be resolved at the current level of authority within an acceptable time frame." },
      { q: "What document tracks active project issues?", a: "The issue log." }
    ],
    tip: "Exam tip: If a scenario describes something that 'has happened' — it's an issue. If it 'might happen' — it's a risk. Don't confuse the two."
  },
  {
    id: "1.6", domain: "Domain 1", domainName: "Project Mgmt Concepts",
    title: "Given a scenario, apply schedule development and management activities and techniques.",
    keys: [
      "WBS (Work Breakdown Structure): hierarchical decomposition of all project work into manageable components.",
      "Activity sequencing: determine dependencies between tasks (FS, FF, SS, SF).",
      "Finish-to-Start (FS): most common — successor can't start until predecessor finishes.",
      "Critical Path Method (CPM): longest path through the network; activities on it have zero float.",
      "Float (slack): amount of time an activity can be delayed without delaying project end.",
      "PERT: uses 3 estimates — Optimistic, Most Likely, Pessimistic. Formula: (O + 4M + P) / 6.",
      "Schedule compression: Crashing (add resources, increases cost) or Fast Tracking (overlap tasks, increases risk).",
      "Gantt chart: bar chart showing tasks, duration, and dependencies over time.",
      "Milestone: significant event or decision point; has zero duration.",
      "Baseline schedule: approved schedule used to measure performance."
    ],
    terms: [
      { t: "WBS", d: "Work Breakdown Structure — hierarchical task decomposition." },
      { t: "Critical Path", d: "Longest path; determines project end date. Zero float." },
      { t: "Float/Slack", d: "Time an activity can slip without delaying the project." },
      { t: "Crashing", d: "Add resources to shorten duration; increases cost." },
      { t: "Fast Tracking", d: "Overlap sequential tasks; increases risk." },
      { t: "PERT", d: "Weighted average: (O + 4M + P) / 6." },
      { t: "Milestone", d: "Key project event; zero duration." },
      { t: "Gantt Chart", d: "Bar chart of tasks and timelines." },
    ],
    flashcards: [
      { q: "What is the PERT formula?", a: "(Optimistic + 4 × Most Likely + Pessimistic) / 6" },
      { q: "What is the critical path?", a: "The longest sequence of tasks that determines the minimum project duration. Activities on it have zero float." },
      { q: "What is the difference between crashing and fast tracking?", a: "Crashing adds resources to shorten duration (costs more). Fast tracking overlaps tasks (adds risk)." },
      { q: "What does float (slack) mean?", a: "The amount of time an activity can be delayed without delaying the project end date." },
      { q: "What is Finish-to-Start dependency?", a: "The successor activity cannot start until the predecessor activity has finished." }
    ],
    tip: "Exam tip: Know the PERT formula and be able to identify which tasks are on the critical path. Critical path tasks = zero float."
  },
  {
    id: "1.7", domain: "Domain 1", domainName: "Project Mgmt Concepts",
    title: "Compare and contrast quality management concepts and performance management concepts.",
    keys: [
      "Quality planning: determine quality standards and how to achieve them (QMP - Quality Management Plan).",
      "Quality assurance (QA): process-oriented; auditing processes to ensure standards are followed.",
      "Quality control (QC): product-oriented; inspecting deliverables to find defects.",
      "Cost of quality: includes cost of conformance (prevention, appraisal) and non-conformance (failures).",
      "KPIs (Key Performance Indicators): measurable metrics to evaluate project success.",
      "EVM (Earned Value Management): integrates scope, schedule, cost to measure performance.",
      "SPI (Schedule Performance Index) = EV/PV. SPI > 1 = ahead of schedule.",
      "CPI (Cost Performance Index) = EV/AC. CPI > 1 = under budget.",
      "CV (Cost Variance) = EV – AC. SV (Schedule Variance) = EV – PV.",
      "Six Sigma: data-driven quality improvement. DMAIC = Define, Measure, Analyze, Improve, Control.",
      "Benchmarking: comparing project metrics to industry standards or past projects."
    ],
    terms: [
      { t: "QA", d: "Quality Assurance — auditing processes, preventing defects." },
      { t: "QC", d: "Quality Control — inspecting products, finding defects." },
      { t: "EVM", d: "Earned Value Management — cost/schedule performance tracking." },

    { q: "SaaS (Software as a Service) is best described as:", options: ["Basic computing infrastructure like servers and storage", "Development environments and tooling delivered over the internet", "A complete software stack accessed through a browser where the vendor manages everything", "A general term for any type of cloud service model"], answer: 2 },
    { q: "What does XaaS stand for?", options: ["Extended as a Service", "Exchange as a Service", "Anything as a Service", "Enterprise as a Service"], answer: 2 }
  ],
  "M.9": [
    { q: "What does a scatter diagram show?", options: ["A step-by-step process flow", "The relationship or correlation between two variables", "Data points plotted over a time sequence", "Defect causes ranked by frequency from highest to lowest"], answer: 1 },
    { q: "A run chart is best described as:", options: ["A four-quadrant grid comparing two project factors", "A time-series line graph showing data over time or sequence", "A root cause diagram mapping categories of causes to an effect", "A chart counting defect frequency by category"], answer: 1 },
    { q: "The five-why analysis technique is primarily used for:", options: ["Tracking sprint velocity across multiple iterations", "Prioritizing defect causes using the 80/20 rule", "Root cause analysis — asking 'why' repeatedly to uncover hidden causes", "Mapping how information flows through a system or process"], answer: 2 },
    { q: "According to the Pareto principle, approximately what portion of problems come from a small number of root causes?", options: ["50% of problems from 50% of causes", "90% of problems from 10% of causes", "80% of problems from 20% of causes", "70% of problems from 30% of causes"], answer: 2 },
    { q: "Which type of diagram would you use to visualize information flow for an audience with mixed technical backgrounds?", options: ["Quadrant diagram", "Scatter diagram", "Data flow diagram (DFD)", "Burndown chart"], answer: 2 }
  ],
  "M.10": [
    { q: "Risk interconnectivity in project management means:", options: ["All risks share the same probability and impact score", "Every risk can create a ripple effect that impacts multiple other events", "High-priority risks automatically escalate to the sponsor", "Risks must always be listed in a specific rank order"], answer: 1 },
    { q: "High detectability in risk management indicates:", options: ["The risk has a very high probability of occurring", "The risk will be very difficult to spot when it occurs", "The risk provides clear, early warning signals when it occurs or is about to occur", "The risk has already been fully mitigated"], answer: 2 },
    { q: "Qualitative risk analysis differs from quantitative risk analysis because it:", options: ["Uses numerical data to assign fully objective risk scores", "Requires specialized statistical software to complete", "Is subjective and perception-based; quick and easy to apply", "Always calculates EMV for every identified risk"], answer: 2 },
    { q: "What does a risk report share with stakeholders throughout the project?", options: ["A complete roster of all project team members and their assignments", "Only risks that have already occurred and been fully resolved", "Notable timely and high-impact risks, plus scope impacts from realized risks", "The full risk register including all probability scores"], answer: 2 },
    { q: "A contingency plan created during risk treatment should include:", options: ["A list of all risks rejected by the CCB", "Budget reserves allocated per risk owner", "Primary contacts, whom to inform, and escalation paths", "The complete risk register exported as a PDF"], answer: 2 }
  ],
  "M.11": [
    { q: "Synchronous communication is best defined as:", options: ["Written messages exchanged asynchronously over email", "Pre-recorded video content distributed to stakeholders", "Real-time interaction where all parties communicate simultaneously", "Documents stored on a shared portal for on-demand retrieval"], answer: 2 },
    { q: "Which of the following is a communication ARTIFACT?", options: ["The stakeholder email distribution list", "A project status presentation deck", "The Microsoft Teams channel used to deliver messages", "The list of recipients defined in the communications plan"], answer: 1 },
    { q: "In a dual-moderator focus group, what is the SECOND moderator's role?", options: ["To take the opposing view from the lead moderator", "To participate as a regular respondent", "To monitor quality and ensure all planned topics are covered", "To transcribe and record all responses verbatim"], answer: 2 },
    { q: "What makes a dueling-moderator focus group unique?", options: ["Participants take turns moderating the discussion", "One group silently observes another group's session", "Both moderators are actively engaged and take OPPOSING VIEWS", "There is only one moderator and all others are respondents"], answer: 2 },
    { q: "What is the defining feature of a two-way focus group?", options: ["Two separate groups answer the same survey independently", "One group observes another focus group's session to gain additional perspective", "Both groups debate each other simultaneously", "Participants receive written prompts instead of verbal facilitation"], answer: 1 }
  ],
  "M.12": [
    { q: "In the SDLC, the High-Level Design (HLD) is created during which phase?", options: ["Design phase", "Testing phase", "Analysis phase", "Implementation phase"], answer: 2 },
    { q: "How does the HLD differ from the LLD?", options: ["HLD is created by developers; LLD is created by architects", "HLD is detailed and technical; LLD is conceptual and high-level", "HLD is conceptual (analysis phase); LLD is detailed technical specs (design phase)", "HLD is produced in design phase; LLD is produced in analysis phase"], answer: 2 },
    { q: "Which ESG factor covers a company's landfill consumption and waste disposal practices?", options: ["Social (S)", "Governance (G)", "Environmental (E)", "Compliance (C)"], answer: 2 },
    { q: "What is the primary role of a business analyst on a project team?", options: ["Writing the technical code for the final product", "Designing the system architecture and integration strategy", "Bridging business requirements and IT capabilities", "Ensuring code quality through automated testing"], answer: 2 },
    { q: "In a business case, the 'current state' section describes:", options: ["The desired future outcomes and success metrics", "The estimated budget for the proposed project", "What is happening RIGHT NOW — the existing problem or situation", "The recommended solution for the identified problem"], answer: 2 }
  ]
};

const domains = [...new Set(data.map(o => o.domain))];
const domainNames = {};
data.forEach(o => { domainNames[o.domain] = o.domainName; });

let activeDomain = "All";
let openCards = new Set();
let flashState = {};
let reviewed = new Set();
data.forEach(o => { flashState[o.id] = { idx: 0, flipped: false }; });
let quizState = {};
data.forEach(o => { quizState[o.id] = { idx: 0, selected: null, score: 0, done: false }; });

function updateProgress() {
  const pct = Math.round((reviewed.size / data.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = `${reviewed.size} of ${data.length} reviewed`;
}

function renderTabs() {
  const cont = document.getElementById('domain-tabs');
  cont.innerHTML = '';
  ['All', ...domains].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (activeDomain === d ? ' active' : '');
    btn.textContent = d === 'All' ? 'All Objectives' : `${d}: ${domainNames[d]}`;
    btn.onclick = () => { activeDomain = d; renderTabs(); renderGrid(); };
    cont.appendChild(btn);
  });
}

function buildQuizHTML(obj) {
  const qs = quizState[obj.id];
  const questions = quizData[obj.id] || [];
  if (!questions.length) return '';
  if (qs.done) {
    const pct = Math.round((qs.score / questions.length) * 100);
    const msg = pct === 100 ? 'Perfect score! 🎉' : pct >= 75 ? 'Great work!' : pct >= 50 ? 'Keep studying!' : 'Review the material and try again.';
    return `<div class="quiz-result"><div class="quiz-score">${qs.score} / ${questions.length}</div><div class="quiz-score-label">${msg}</div><button class="quiz-retry" onclick="retryQuiz('${obj.id}', event)">Retry Quiz</button></div>`;
  }
  const q = questions[qs.idx];
  const optHTML = q.options.map((opt, i) => {
    let cls = 'quiz-opt';
    const dis = qs.selected !== null ? 'disabled' : '';
    if (qs.selected !== null) {
      if (i === q.answer) cls += ' correct';
      else if (i === qs.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" ${dis} onclick="selectQuizOpt('${obj.id}', ${i}, event)">${opt}</button>`;
  }).join('');
  let feedHTML = '';
  if (qs.selected !== null) {
    const ok = qs.selected === q.answer;
    const last = qs.idx === questions.length - 1;
    const action = last ? `finishQuiz('${obj.id}', event)` : `nextQuiz('${obj.id}', event)`;
    const label = last ? 'See Results' : 'Next Question';
    feedHTML = `<div class="quiz-feedback ${ok ? 'quiz-correct-msg' : 'quiz-wrong-msg'}">${ok ? '✓ Correct!' : '✗ Correct answer: ' + q.options[q.answer]}</div><button class="quiz-next" onclick="${action}">${label}</button>`;
  }
  return `<div class="quiz-q">${qs.idx + 1}. ${q.q}</div><div class="quiz-opts">${optHTML}</div>${feedHTML}<div class="quiz-progress">${qs.idx + 1} / ${questions.length}</div>`;
}

function renderGrid() {
  const cont = document.getElementById('obj-grid');
  const filtered = activeDomain === 'All' ? data : data.filter(o => o.domain === activeDomain);
  cont.innerHTML = '';
  filtered.forEach(obj => {
    const card = document.createElement('div');
    card.className = 'obj-card';
    const isOpen = openCards.has(obj.id);
    const fs = flashState[obj.id];

    card.innerHTML = `
      <div class="obj-header" onclick="toggleCard('${obj.id}')">
        <span class="obj-id">${obj.id}</span>
        <span class="obj-title">${obj.title}</span>
        <i class="ti ti-chevron-down obj-chevron ${isOpen ? 'open' : ''}" aria-hidden="true"></i>
      </div>
      <div class="obj-body ${isOpen ? 'open' : ''}" id="body-${obj.id}">
        <div class="section-label">Key concepts</div>
        <ul class="key-list">${obj.keys.map(k => `<li>${k}</li>`).join('')}</ul>

        <div class="section-label">Terms to know</div>
        <div class="term-grid">${obj.terms.map(t => `<div class="term-card"><div class="term-name">${t.t}</div><div class="term-def">${t.d}</div></div>`).join('')}</div>

        <div class="section-label">Flashcards (${obj.flashcards.length} cards)</div>
        <div class="flash-wrap">
          <div class="flash-card ${fs.flipped ? 'flipped' : ''}" id="flash-${obj.id}" onclick="flipCard('${obj.id}')">
            <div class="flash-q">${obj.flashcards[fs.idx].q}</div>
            <div class="flash-a">${obj.flashcards[fs.idx].a}</div>
          </div>
          <div class="flash-hint">Tap to ${fs.flipped ? 'hide answer' : 'reveal answer'}</div>
          <div class="flash-nav">
            <button onclick="prevFlash('${obj.id}', event)"><i class="ti ti-arrow-left" aria-hidden="true"></i> Prev</button>
            <span class="flash-count">${fs.idx + 1} / ${obj.flashcards.length}</span>
            <button onclick="nextFlash('${obj.id}', event)">Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
          </div>
        </div>

        <div class="tip-box"><div class="tip-text"><strong>💡 Exam tip:</strong> ${obj.tip.replace('Exam tip: ', '')}</div></div>

        <div class="section-label">Practice Quiz</div>
        <div class="quiz-wrap" id="quiz-${obj.id}">${buildQuizHTML(obj)}</div>
      </div>
    `;
    cont.appendChild(card);
  });
}

window.toggleCard = function(id) {
  if (openCards.has(id)) { openCards.delete(id); }
  else { openCards.add(id); reviewed.add(id); updateProgress(); }
  renderGrid();
};

window.flipCard = function(id) {
  flashState[id].flipped = !flashState[id].flipped;
  renderGrid();
};

window.nextFlash = function(id, e) {
  e.stopPropagation();
  const obj = data.find(o => o.id === id);
  flashState[id].idx = (flashState[id].idx + 1) % obj.flashcards.length;
  flashState[id].flipped = false;
  renderGrid();
};

window.prevFlash = function(id, e) {
  e.stopPropagation();
  const obj = data.find(o => o.id === id);
  flashState[id].idx = (flashState[id].idx - 1 + obj.flashcards.length) % obj.flashcards.length;
  flashState[id].flipped = false;
  renderGrid();
};

window.selectQuizOpt = function(id, i, e) {
  e.stopPropagation();
  const qs = quizState[id];
  if (qs.selected !== null) return;
  qs.selected = i;
  const questions = quizData[id] || [];
  if (i === questions[qs.idx].answer) qs.score++;
  const obj = data.find(o => o.id === id);
  const wrap = document.getElementById('quiz-' + id);
  if (wrap) wrap.innerHTML = buildQuizHTML(obj);
};

window.nextQuiz = function(id, e) {
  e.stopPropagation();
  const qs = quizState[id];
  qs.idx++;
  qs.selected = null;
  const obj = data.find(o => o.id === id);
  const wrap = document.getElementById('quiz-' + id);
  if (wrap) wrap.innerHTML = buildQuizHTML(obj);
};

window.finishQuiz = function(id, e) {
  e.stopPropagation();
  quizState[id].done = true;
  const obj = data.find(o => o.id === id);
  const wrap = document.getElementById('quiz-' + id);
  if (wrap) wrap.innerHTML = buildQuizHTML(obj);
};

window.retryQuiz = function(id, e) {
  e.stopPropagation();
  quizState[id] = { idx: 0, selected: null, score: 0, done: false };
  const obj = data.find(o => o.id === id);
  const wrap = document.getElementById('quiz-' + id);
  if (wrap) wrap.innerHTML = buildQuizHTML(obj);
};

renderTabs();
renderGrid();
updateProgress();

// Dark mode
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('sg-theme', theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
const _savedTheme = localStorage.getItem('sg-theme');
if (_savedTheme) {
  applyTheme(_savedTheme);
} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  applyTheme('dark');
} else {
  applyTheme('light');
}
</script>
</body>
</html>
